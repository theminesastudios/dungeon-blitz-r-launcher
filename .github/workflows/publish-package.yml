name: Publish package

# Publishes the launcher to GitHub Packages whenever package.json's version changes on
# main. Touching package.json for any other reason (a script, a build setting) does not
# publish: the version is compared against the previous commit first.

on:
  push:
    branches: [main]
    paths:
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The previous commit is needed to tell a version bump from any other edit.
          fetch-depth: 2
          # payload/ is excluded from the published tarball, so the LFS objects are not
          # worth pulling here.
          lfs: false

      - name: Decide whether the version changed
        id: version
        run: |
          current=$(jq -r .version package.json)
          previous=$(git show HEAD~1:package.json 2>/dev/null | jq -r .version || echo "")
          echo "current=$current" >> "$GITHUB_OUTPUT"
          # A manual run is a deliberate "publish this version": it is how the first
          # release gets out, and how a failed publish is retried without a fake bump.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run; publishing $current regardless of the previous version."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$current" = "$previous" ]; then
            echo "Version is still $current; nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version went from ${previous:-none} to $current."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@theminesastudios"

      - name: Publish
        if: steps.version.outputs.changed == 'true'
        # No install step: publishing only reads package.json and the files it lists, and
        # --ignore-scripts keeps a dependency's lifecycle script out of a job that holds a
        # packages:write token.
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.version.outputs.changed == 'true'
        run: |
          {
            echo "### Published"
            echo
            echo "\`@theminesastudios/dungeon-blitz-r-launcher@${{ steps.version.outputs.current }}\`"
            echo
            echo "Installers are built separately by the Release workflow; tag \`v${{ steps.version.outputs.current }}\` to produce them."
          } >> "$GITHUB_STEP_SUMMARY"
